name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: swift build -c release
      - name: Package command-line tools
        run: |
          mkdir dist
          cp .build/release/edgeguard-cli .build/release/edgeguard-eval dist/
          cp README.md LICENSE dist/
          cd dist && zip -r ../edgeguard-cli-macos.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" edgeguard-cli-macos.zip --generate-notes --title "$GITHUB_REF_NAME"
